<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | NES FITNESS Australia</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap"
        rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-black': '#000000',
                        'brand-gray': '#111111',
                        'brand-gold': '#E5A900',
                    },
                    fontFamily: {
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                        'noto': ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::selection {
            background: #E5A900;
            color: #000;
        }
    </style>
</head>

<body class="bg-brand-black text-white font-inter h-screen flex items-center justify-center relative overflow-hidden">
    <script>
        window.isSignUp = false;

        window.toggleMode = function () {
            try {
                console.log('Toggling mode');
                window.isSignUp = !window.isSignUp;
                const title = document.getElementById('pageTitle');
                const btn = document.getElementById('loginBtn');
                const loginFooter = document.getElementById('loginFooterText');
                const signupFooter = document.getElementById('signupFooterText');
                const signupFields = document.getElementById('signupFields');

                if (window.isSignUp) {
                    title.innerText = 'Create Account';
                    btn.innerText = 'Sign Up';
                    loginFooter.classList.add('hidden');
                    signupFooter.classList.remove('hidden');
                    signupFields.classList.remove('hidden');
                } else {
                    title.innerText = 'Welcome Back';
                    btn.innerText = 'Sign In';
                    loginFooter.classList.remove('hidden');
                    signupFooter.classList.add('hidden');
                    signupFields.classList.add('hidden');
                }
            } catch (err) {
                alert('JS Error: ' + err.message);
                console.error(err);
            }
        };
    </script>
    <!-- Background -->
    <div
        class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070')] bg-cover bg-center opacity-20 blur-sm">
    </div>
    <div class="absolute inset-0 bg-brand-black/80"></div>

    <!-- Login Card -->
    <div
        class="relative z-10 w-full max-w-md bg-brand-gray/80 backdrop-blur-md p-10 rounded-3xl border border-white/10 shadow-2xl">

        <!-- Header -->
        <div class="text-center mb-10">
            <a href="index.html" class="inline-flex items-center gap-2 mb-6 hover:opacity-80 transition-opacity">
                <i data-lucide="box" class="text-brand-gold w-8 h-8 stroke-[2.5]"></i>
                <span class="font-noto font-black text-2xl tracking-normal uppercase leading-none"
                    style="letter-spacing: -0.02em;">NES FITNESS</span>
            </a>
            <h1 id="pageTitle" class="font-montserrat font-bold text-2xl">Welcome Back</h1>
            <p class="text-gray-400 text-sm mt-2">Enter your details to access your account.</p>
        </div>

        <!-- Form -->
        <form class="space-y-6" onsubmit="handleAuth(event)">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                    <input type="email" id="email" placeholder="member@jfitbox.com.au"
                        class="w-full bg-black/50 border border-white/10 rounded-xl py-4 pl-12 pr-4 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600">
                </div>
            </div>

            <!-- Extra Fields for Signup -->
            <div id="signupFields" class="hidden space-y-4 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">

                <!-- Mandatory Fields -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Full Name <span
                            class="text-red-500">*</span></label>
                    <div class="relative">
                        <i data-lucide="user"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="fullName" placeholder="John Doe"
                            class="w-full bg-black/50 border border-white/10 rounded-xl py-3 pl-12 pr-4 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Phone Number <span
                            class="text-red-500">*</span></label>
                    <div class="relative">
                        <i data-lucide="phone"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="tel" id="phone" placeholder="0400 000 000"
                            class="w-full bg-black/50 border border-white/10 rounded-xl py-3 pl-12 pr-4 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Address <span
                            class="text-red-500">*</span></label>
                    <div class="relative">
                        <i data-lucide="map-pin"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="address" placeholder="123 Gym St, Sydney"
                            class="w-full bg-black/50 border border-white/10 rounded-xl py-3 pl-12 pr-4 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Username (ID) <span
                            class="text-red-500">*</span></label>
                    <div class="relative">
                        <i data-lucide="at-sign"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="username" placeholder="jdoe123"
                            class="w-full bg-black/50 border border-white/10 rounded-xl py-3 pl-12 pr-4 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600 text-sm">
                    </div>
                </div>

                <!-- Optional Fields -->
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Fitness Goal</label>
                    <textarea id="fitnessGoal" rows="2" placeholder="e.g. Lose weight, Build muscle..."
                        class="w-full bg-black/50 border border-white/10 rounded-xl p-3 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600 text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Medical History /
                        Injuries</label>
                    <textarea id="medicalHistory" rows="2" placeholder="e.g. Lower back pain, Asthma..."
                        class="w-full bg-black/50 border border-white/10 rounded-xl p-3 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600 text-sm"></textarea>
                </div>

            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full bg-black/50 border border-white/10 rounded-xl py-4 pl-12 pr-4 focus:border-brand-gold focus:outline-none transition-colors text-white placeholder-gray-600">
                </div>
            </div>

            <div class="flex justify-between items-center text-xs">
                <label class="flex items-center gap-2 cursor-pointer text-gray-400 hover:text-white">
                    <input type="checkbox"
                        class="rounded bg-black border-white/20 text-brand-gold focus:ring-brand-gold">
                    Remember me
                </label>
                <a href="#" class="text-brand-gold hover:underline">Forgot password?</a>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-brand-gold text-black font-montserrat font-black uppercase py-4 rounded-xl hover:bg-white transition-colors shadow-lg shadow-brand-gold/20">
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center text-sm text-gray-400 relative z-20">
            <p id="loginFooterText">
                Not a member yet? <a href="#" onclick="window.toggleMode(); return false;" id="toSignupBtn"
                    class="text-white font-bold hover:text-brand-gold transition-colors cursor-pointer relative z-50 underline decoration-transparent hover:decoration-brand-gold underline-offset-4 outline-none">Create
                    Account</a>
            </p>
            <p id="signupFooterText" class="hidden">
                Already a member? <a href="javascript:window.toggleMode()" id="toLoginBtn"
                    class="text-white font-bold hover:text-brand-gold transition-colors cursor-pointer relative z-50 underline decoration-transparent hover:decoration-brand-gold underline-offset-4 outline-none">Sign
                    In</a>
            </p>
        </div>

    </div>

    <script>lucide.createIcons();</script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. UI LOGIC MOVED TO TOP


        // 2. SUPABASE INITIALIZATION
        let supabase = null;
        try {
            const supabaseUrl = 'https://uufyhygerddlrjgtxeyh.supabase.co';
            const supabaseKey = 'sb_publishable_SInjSUnTug_jI5uH_Yv0mA_DZT6PbxY';
            if (window.supabase) {
                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            } else {
                console.error('Supabase library not loaded');
                alert('System Error: Database connection failed. Please refresh.');
            }
        } catch (err) {
            console.error('Supabase Init Error:', err);
        }

        // 3. AUTH HANDLER
        async function handleAuth(e) {
            e.preventDefault();

            if (!supabase) {
                alert('System Error: Database not connected.');
                return;
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            // Signup validation
            let fullName, phone, address, username, fitnessGoal, medicalHistory;

            if (window.isSignUp) {
                fullName = document.getElementById('fullName').value;
                phone = document.getElementById('phone').value;
                address = document.getElementById('address').value;
                username = document.getElementById('username').value;
                fitnessGoal = document.getElementById('fitnessGoal').value;
                medicalHistory = document.getElementById('medicalHistory').value;

                if (!fullName || !phone || !address || !username) {
                    alert('Please fill in all mandatory fields (Name, Phone, Address, Username).');
                    return;
                }
            }

            btn.innerText = 'Processing...';
            btn.disabled = true;

            try {
                if (window.isSignUp) {
                    // 1. SIGN UP (Auth)
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                full_name: fullName
                            }
                        }
                    });
                    if (error) throw error;

                    // 2. CREATE PROFILE (DB)
                    if (data.user) {
                        const { error: profileError } = await supabase
                            .from('profiles')
                            .insert([
                                {
                                    id: data.user.id,
                                    email: email,
                                    full_name: fullName,
                                    phone: phone,
                                    address: address,
                                    username: username,
                                    fitness_goal: fitnessGoal,
                                    medical_history: medicalHistory
                                }
                            ]);

                        if (profileError) {
                            console.error('Profile creation failed:', profileError);
                            alert('Account created but profile update failed. Please contact support.');
                        } else {
                            showSuccessModal();
                        }
                    }

                } else {
                    // LOGIN
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    if (error) throw error;

                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative bg-brand-gray border border-brand-gold/20 p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-95 opacity-0 transition-all duration-300"
            id="successModalContent">
            <div class="w-16 h-16 bg-brand-gold/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle-2" class="w-8 h-8 text-brand-gold"></i>
            </div>
            <h3 class="text-xl font-montserrat font-bold text-white mb-2">Account Created!</h3>
            <p class="text-gray-400 text-sm mb-6">Your registration was successful. You can now sign in to access your
                dashboard.</p>
            <button onclick="closeSuccessModal()"
                class="w-full bg-brand-gold text-black font-montserrat font-bold py-3 text-sm rounded-xl hover:bg-white transition-colors">
                Continue to Sign In
            </button>
        </div>
    </div>

    <script>
        function showSuccessModal() {
            const modal = document.getElementById('successModal');
            const content = document.getElementById('successModalContent');
            modal.classList.remove('hidden');
            // Allow display: block to render before triggering opacity transition
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            const content = document.getElementById('successModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                window.toggleMode(); // Ensure they are switched back to the login view
            }, 300); // Wait for transition
        }
    </script>
</body>

</html>
