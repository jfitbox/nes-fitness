<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile | NES FITNESS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap"
        rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-black': '#000000',
                        'brand-gray': '#111111',
                        'brand-charcoal': '#1A1A1A',
                        'brand-gold': '#E5A900',
                    },
                    fontFamily: {
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                        'noto': ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        body {
            overscroll-behavior-y: none;
        }
    </style>
</head>

<body class="bg-brand-black text-white font-inter h-screen flex overflow-hidden">

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex w-64 flex-col border-r border-white/5 bg-brand-gray/50 h-full p-6">
        <a href="index.html" class="flex items-center gap-3 mb-12">
            <i data-lucide="box" class="text-brand-gold w-8 h-8 stroke-[2.5]"></i>
            <span class="font-noto font-black text-xl tracking-normal uppercase leading-none"
                style="letter-spacing: -0.02em;">NES FITNESS</span>
        </a>
        <nav class="flex-1 space-y-4">
            <a href="dashboard.html"
                class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all font-medium">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>
            <a href="schedule.html"
                class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all font-medium">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                Schedule
            </a>
            <a href="#"
                class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-all font-medium">
                <i data-lucide="dumbbell" class="w-5 h-5"></i>
                Workouts
            </a>
            <a href="profile.html"
                class="flex items-center gap-4 px-4 py-3 bg-brand-gold text-black rounded-xl font-bold transition-all">
                <i data-lucide="user" class="w-5 h-5"></i>
                Profile
            </a>
        </nav>
        <div class="border-t border-white/10 pt-6">
            <button onclick="logout()"
                class="flex items-center gap-4 px-4 py-3 text-red-500 hover:bg-red-500/10 rounded-xl transition-all w-full font-medium">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 h-full overflow-y-auto relative pb-24 md:pb-0">

        <!-- Header (Mobile Only) -->
        <header
            class="md:hidden flex items-center justify-between p-6 sticky top-0 z-20 bg-brand-black/90 backdrop-blur-md">
            <div class="flex items-center gap-2">
                <i data-lucide="box" class="text-brand-gold w-6 h-6 stroke-[2.5]"></i>
                <span class="font-noto font-black text-lg">NES FITNESS</span>
            </div>
            <div class="w-8 h-8 bg-gray-700 rounded-full overflow-hidden border border-white/20">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=100"
                    class="w-full h-full object-cover">
            </div>
        </header>

        <!-- Content -->
        <div class="p-6 md:p-12 max-w-2xl mx-auto">

            <h1 class="text-3xl font-montserrat font-bold mb-8">My Profile</h1>

            <!-- Profile Card -->
            <div
                class="bg-brand-charcoal border border-white/5 rounded-3xl p-8 mb-8 text-center md:text-left flex flex-col md:flex-row items-center gap-8">
                <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-brand-gold/20">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=400"
                        class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 class="text-2xl font-black uppercase mb-1" id="userName">Loading...</h2>
                    <p class="text-brand-gold font-bold text-sm mb-4">Premium Member</p>
                    <div class="flex flex-wrap justify-center md:justify-start gap-4">
                        <span class="bg-black/50 px-4 py-2 rounded-lg text-xs font-bold uppercase text-gray-400">Since
                            2024</span>
                        <span
                            class="bg-black/50 px-4 py-2 rounded-lg text-xs font-bold uppercase text-gray-400">Brisbane
                            Club</span>
                    </div>
                </div>
            </div>

            <!-- Settings Grid -->
            <div class="space-y-4">
                <button
                    class="w-full bg-brand-charcoal border border-white/5 rounded-2xl p-4 flex items-center justify-between hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500">
                            <i data-lucide="credit-card" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <h3 class="font-bold">Membership & Billing</h3>
                            <p class="text-xs text-gray-400">Manage your subscription</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-500"></i>
                </button>

                <button
                    class="w-full bg-brand-charcoal border border-white/5 rounded-2xl p-4 flex items-center justify-between hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 rounded-full bg-green-500/10 flex items-center justify-center text-green-500">
                            <i data-lucide="bell" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <h3 class="font-bold">Notifications</h3>
                            <p class="text-xs text-gray-400">Customize alerts</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-500"></i>
                </button>

                <button onclick="logout()"
                    class="w-full bg-red-500/10 border border-red-500/20 rounded-2xl p-4 flex items-center justify-between hover:bg-red-500/20 transition-colors text-red-500">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <h3 class="font-bold">Sign Out</h3>
                            <p class="text-xs text-red-400">Log out of your account</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-red-500"></i>
                </button>
            </div>

        </div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav
        class="md:hidden fixed bottom-0 left-0 w-full bg-brand-charcoal/90 backdrop-blur-xl border-t border-white/5 pb-safe px-6 py-4 flex justify-between items-center z-50">
        <a href="dashboard.html"
            class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="schedule.html"
            class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i data-lucide="calendar" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Schedule</span>
        </a>
        <div class="relative -top-6">
            <button
                class="bg-brand-gold text-black w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-brand-gold/30 transform hover:scale-110 transition-transform">
                <i data-lucide="qr-code" class="w-7 h-7"></i>
            </button>
        </div>
        <a href="#" class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
            <i data-lucide="dumbbell" class="w-6 h-6"></i>
            <span class="text-[10px] font-medium">Workouts</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center gap-1 text-brand-gold">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">Profile</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        lucide.createIcons();

        // AUTH PROTECTION
        const supabaseUrl = 'https://uufyhygerddlrjgtxeyh.supabase.co';
        const supabaseKey = 'sb_publishable_SInjSUnTug_jI5uH_Yv0mA_DZT6PbxY';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            // Set User Email
            document.getElementById('userName').innerText = session.user.email.split('@')[0];
        }
        checkSession();

        async function logout() {
            const { error } = await supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
